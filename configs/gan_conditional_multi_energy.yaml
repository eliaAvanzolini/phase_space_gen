# configs/gan_conditional_multi_energy.yaml
# ─────────────────────────────────────────────────────────────────────────────
# GAN (WGAN-GP) condizionale su multi-energia (6MV + 10MV) — Strada B
#
# Basato su Sarrut et al. 2019, esteso con condizionamento.
#
# Uso:
#   python train.py --config configs/gan_conditional_multi_energy.yaml
#
# NOTA: Il training GAN condizionale è notoriamente instabile.
# Monitorare w_dist e gp durante il training. Se il training collassa,
# provare a ridurre lr o aumentare n_critic.
# ─────────────────────────────────────────────────────────────────────────────

model: gan
conditional: true

# ── Dati ──────────────────────────────────────────────────────────────────────
data_path: data/elekta_multi_energy.h5

# ── Architettura (Sarrut 2019) ────────────────────────────────────────────────
gan_hidden_dims: [400, 400, 400]

# ── Training WGAN-GP ──────────────────────────────────────────────────────────
epochs: 10              # Settato a 10 per test — aumentare sul cluster (80000)
batch_size: 10000
lr: 1e-5
n_critic: 4
val_every: 2
save_every: 5
seed: 42

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: outputs
run_name: gan_conditional_6mv_10mv

# configs/nsf_default.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Configurazione di default per Neural Spline Flow
# Fase 2 della roadmap: primo confronto NF vs GAN baseline
# ─────────────────────────────────────────────────────────────────────────────

model: nsf
conditional: false      # true per NSF condizionato (Fase 3)

# ── Dati ──────────────────────────────────────────────────────────────────────
n_samples: 1000000
E_nom: 6.0
jaw_x: 5.0
jaw_y: 5.0

# ── Architettura ──────────────────────────────────────────────────────────────
n_transforms: 6         # numero di coupling layers (6-8 consigliato per 6D)
n_bins: 8               # bin delle spline (aumentare per più espressività)
hidden_dim: 128         # layer interni delle coupling nets

# ── Training ──────────────────────────────────────────────────────────────────
epochs: 200
batch_size: 2048
lr: 0.001
weight_decay: 0.00001
clip_grad: 1.0
val_every: 5
save_every: 20
seed: 42

output_dir: outputs
